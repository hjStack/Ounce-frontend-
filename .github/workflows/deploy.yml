name: Ounce 프론트엔드 배포

on:
  push:
    branches: [ "main", "dev", "feature/**" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v3

      - name: 🛡️ .env 파일 만들기
        env:
          ENV_FILE: ${{ secrets.FRONTEND_ENV }}
        run: |
          printf '%s' "$ENV_FILE" > .env

      - name: 🐳 도커 허브 로그인
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🚀 도커 이미지 빌드 및 푸시
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/ounce-frontend:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/ounce-frontend:latest

      # 👇 현재 테스트를 위해 if 조건을 임시로 제거했습니다.
      - name: 📦 설정 파일 운영 서버로 전송
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # 백엔드와 파일 이름이 다릅니다!
          source: "docker-compose.frontend.yml,deploy-frontend.sh,.env"
          target: /home/${{ secrets.SERVER_USERNAME }}/ounce-frontend

      - name: 🌐 운영 서버 접속 및 무중단 배포 실행
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          
          command_timeout: 20m
          script: |
            set -e
            cd /home/${{ secrets.SERVER_USERNAME }}/ounce-frontend
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/ounce-frontend:latest
            chmod +x ./deploy-frontend.sh
            ./deploy-frontend.sh