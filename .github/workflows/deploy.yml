name: 1인 가구를 위한 Ounce 프론트엔드 배포

on:
  push:
    branches: [ "main", "dev", "feature/**" ]
  pull_request:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v3

      # 프론트엔드는 application.yml 대신 .env 파일을 사용합니다.
      - name: 🛡️ .env 파일 만들기
        env:
          ENV_FILE: ${{ secrets.FRONTEND_ENV }}
        run: |
          printf '%s' "$ENV_FILE" > .env

      - name: 🐳 도커 허브 로그인
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 프론트엔드는 도커 파일 내부에서 npm install 및 build를 수행하는 것이 정석입니다.
      - name: 🚀 도커 이미지 빌드 및 푸시
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/ounce-api:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/ounce-api:latest

      # 백엔드와 파일명이 겹치지 않게 프론트엔드용 설정 파일만 전송합니다.
      - name: 📦 설정 파일 운영 서버로 전송
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.frontend.yml,deploy-frontend.sh"
          target: /home/${{ secrets.SERVER_USERNAME }}/ounce-frontend

      - name: 🌐 운영 서버 접속 및 무중단 배포 실행
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd /home/${{ secrets.SERVER_USERNAME }}/ounce-frontend
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/ounce-api:latest
            chmod +x ./deploy-frontend.sh
            ./deploy-frontend.sh