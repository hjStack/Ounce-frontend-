name: Ounce 프론트엔드 배포

on:
  push:
    branches: [ "main", "dev", "feature/**" ]

jobs:
  build-and-deploy:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v3

      - name: 🛡️ .env 파일 만들기
        env:
          ENV_FILE: ${{ secrets.FRONTEND_ENV }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          printf '%s' "$ENV_FILE" > .env
          printf '\nFRONTEND_IMAGE=%s/ounce-frontend:latest\n' "$DOCKER_USERNAME" >> .env

      - name: 🐳 도커 허브 로그인
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🚀 도커 이미지 빌드 및 푸시
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/ounce-frontend:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/ounce-frontend:latest

      - name: 🌐 EC2 로컬 배포 실행
        run: |
          set -e
          DEPLOY_DIR="/home/ubuntu/ounce-frontend"

          mkdir -p "$DEPLOY_DIR/nginx"
          cp docker-compose.frontend.yml deploy-frontend.sh .env maintenance.html "$DEPLOY_DIR/"
          cp nginx/frontend-error-page.conf "$DEPLOY_DIR/nginx/"

          chmod +x "$DEPLOY_DIR/deploy-frontend.sh"
          cd "$DEPLOY_DIR"
          SKIP_IMAGE_PULL=1 ./deploy-frontend.sh
