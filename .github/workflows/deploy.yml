name: Ounce 프론트엔드 배포

on:
  push:
    branches: ["main", "dev", "feature/**"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v3

      - name: 🛡️ .env 파일 만들기
        env:
          ENV_FILE: ${{ secrets.FRONTEND_ENV }}
        run: |
          printf '%s' "$ENV_FILE" > .env

      - name: 🐳 도커 허브 로그인
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🚀 도커 이미지 빌드 및 푸시
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/ounce-frontend:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/ounce-frontend:latest

      - name: 🔎 SSH host 값 검증
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          if [ -z "$SERVER_HOST" ]; then
            echo "::error::SERVER_HOST secret이 비어 있습니다."
            exit 1
          fi

          if [[ "$SERVER_HOST" == *"://"* || "$SERVER_HOST" == *"@"* || "$SERVER_HOST" == *":"* || "$SERVER_HOST" == *"/"* ]]; then
            echo "::error::SERVER_HOST에는 포트, 프로토콜, 사용자명, 경로 없이 EC2 Public IPv4 또는 Public DNS만 입력하세요."
            exit 1
          fi

          if ! getent hosts "$SERVER_HOST" > /dev/null; then
            echo "::error::SERVER_HOST가 IP 또는 DNS 이름으로 해석되지 않습니다. EC2 콘솔의 Public IPv4/Public DNS 값을 확인하세요."
            exit 1
          fi

      - name: 🔎 GitHub Actions runner IP 조회
        id: runner_ip
        run: |
          RUNNER_IP="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')"

          if [[ ! "$RUNNER_IP" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::runner public IP를 확인하지 못했습니다: $RUNNER_IP"
            exit 1
          fi

          echo "ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"
          echo "Runner public IP: $RUNNER_IP"

      - name: 🔐 AWS 인증 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 🔐 runner IP를 SSH 보안그룹에 임시 허용
        id: allow_runner_ssh
        env:
          SECURITY_GROUP_ID: ${{ secrets.EC2_SSH_SECURITY_GROUP_ID }}
          RUNNER_IP: ${{ steps.runner_ip.outputs.ip }}
        run: |
          if [ -z "$SECURITY_GROUP_ID" ]; then
            echo "::error::EC2_SSH_SECURITY_GROUP_ID secret이 비어 있습니다."
            exit 1
          fi

          ADDED=false
          if OUTPUT=$(aws ec2 authorize-security-group-ingress \
              --group-id "$SECURITY_GROUP_ID" \
              --protocol tcp \
              --port 22 \
              --cidr "$RUNNER_IP/32" 2>&1); then
            ADDED=true
            echo "Runner IP SSH rule added: $RUNNER_IP/32"
          elif echo "$OUTPUT" | grep -q "InvalidPermission.Duplicate"; then
            echo "Runner IP SSH rule already exists: $RUNNER_IP/32"
          else
            echo "$OUTPUT"
            exit 1
          fi

          echo "added=$ADDED" >> "$GITHUB_OUTPUT"

      - name: 🔎 SSH 포트 연결 확인
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          echo "Checking TCP connection to SERVER_HOST:22..."
          if ! timeout 10 bash -c '</dev/tcp/$SERVER_HOST/22'; then
            echo "::error::GitHub Actions runner에서 EC2 22번 포트로 접속할 수 없습니다. EC2 보안그룹 SSH 인바운드에는 신뢰 가능한 고정 IP/32만 추가하세요. GitHub-hosted runner는 IP가 바뀔 수 있으므로 self-hosted runner 또는 고정 egress IP를 권장합니다."
            exit 1
          fi
          echo "TCP 22 is reachable."

      # 👇 현재 테스트를 위해 if 조건을 임시로 제거했습니다.
      - name: 📦 설정 파일 운영 서버로 전송
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: 22
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # 백엔드와 파일 이름이 다릅니다!
          source: "docker-compose.frontend.yml,deploy-frontend.sh,.env,maintenance.html,nginx/frontend-error-page.conf"
          target: /home/${{ secrets.SERVER_USERNAME }}/ounce-frontend

      - name: 🌐 운영 서버 접속 및 무중단 배포 실행
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: 22
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          command_timeout: 20m
          script: |
            set -e
            cd /home/${{ secrets.SERVER_USERNAME }}/ounce-frontend
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/ounce-frontend:latest
            chmod +x ./deploy-frontend.sh
            ./deploy-frontend.sh

      - name: 🔒 runner IP SSH 임시 허용 제거
        if: always() && steps.allow_runner_ssh.outputs.added == 'true'
        env:
          SECURITY_GROUP_ID: ${{ secrets.EC2_SSH_SECURITY_GROUP_ID }}
          RUNNER_IP: ${{ steps.runner_ip.outputs.ip }}
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$SECURITY_GROUP_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "$RUNNER_IP/32" || true
