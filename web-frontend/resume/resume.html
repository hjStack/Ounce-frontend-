<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이력서</title>
    <link rel="stylesheet" href="../css/resume.css" />
  </head>
  <body>
    <div class="resume">
      <div class="content">
        <div class="info_graph">
          <div class="picture1">
            <img src="../images/hj.jpeg" alt="프로필" class="img1" />
          </div>
          <div class="line"></div>
          <div class="basic">
            <div class="pInfo1">기본사항</div>
            <div class="pInfo2">personal Information</div>
          </div>
          <div class="line"></div>
          <div class="basic">
            <div class="pInfo1">학력사항</div>
            <div class="pInfo2">education</div>
          </div>
          <div class="line"></div>
          <div class="basic">
            <div class="pInfo1">보유자격증</div>
            <div class="pInfo2">License</div>
          </div>
          <div class="line"></div>
          <div class="basic">
            <div class="pInfo1">사회경험</div>
            <div class="pInfo2">Experience</div>
          </div>
          <div class="line"></div>
          <div class="basic">
            <div class="pInfo1">기술사항</div>
            <div class="pInfo2">Skills</div>
          </div>
        </div>
        <div class="personal_information">
          <div class="name_info">
            <div class="n1">한 끗이 다른 지원자</div>
            <div class="n2">권혜준입니다!</div>
          </div>
          <div class="line"></div>
          <div class="info">
            <div class="info1">
              <img
                src="../images/profile.png"
                alt="profile"
                width="10px"
                height="10px"
              />
              <div>2000-02-02</div>
            </div>

            <div class="info1">
              <img
                src="../images/call.png"
                alt="telephone"
                width="10px"
                height="10px"
              />
              <div>010-1234-5678</div>
            </div>
            <div class="info1">
              <img
                src="../images/address.png"
                alt="telephone"
                width="10px"
                height="10px"
              />
              <div>서울특별시 구로구 구로디지털로 11번길 11</div>
            </div>
          </div>
          <div class="line"></div>
          <div class="career">
            <div class="career1">
              <div class="career1">서울미리고등학교</div>
              <div class="font1">인문계열 | 서울</div>
            </div>

            <div class="career1">
              <div class="career1">서울미리대학교</div>
              <div class="font1">경영학과 | 서울</div>
            </div>
          </div>
          <div class="line"></div>
          <div class="License">
            <div class="License1">운전면허증</div>
            <div class="License1">정보처리기사</div>
          </div>
          <div class="line"></div>
          <div class="Experience">
            <img
              src="../images/likeLion.png"
              width="22px"
              height="22px"
              class="sk1"
            />
            <div class="ex1">멋쟁이 사자처럼</div>
          </div>

          <div class="line"></div>

          <div class="skills">
            <div class="Skills_ins">
              <img
                src="../images/java.png"
                width="22px"
                height="22px"
                class="sk1"
              />
              <div class="sk_Wr">JAVA</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
