<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>서비스 점검 중 | Ounce</title>
        <style>
            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                background: #fcfbf9;
                color: #0c0a09;
                font-family:
                    "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
                    system-ui, sans-serif;
            }

            main {
                display: flex;
                min-height: 100vh;
                align-items: center;
                justify-content: center;
                padding: 48px 24px;
            }

            section {
                width: 100%;
                max-width: 560px;
            }

            .badge {
                display: inline-flex;
                border: 1px solid #f5c7b2;
                border-radius: 999px;
                background: #ffffff;
                padding: 6px 12px;
                color: #9c3f15;
                font-size: 12px;
                font-weight: 800;
            }

            h1 {
                margin: 20px 0 0;
                font-size: clamp(36px, 7vw, 52px);
                line-height: 1.15;
                font-weight: 900;
                word-break: keep-all;
            }

            p {
                margin: 20px 0 0;
                color: #57534e;
                font-size: 16px;
                line-height: 1.75;
                word-break: keep-all;
            }

            a {
                display: inline-flex;
                margin-top: 32px;
                border-radius: 8px;
                background: #2f7a5f;
                color: #ffffff;
                padding: 12px 20px;
                font-size: 14px;
                font-weight: 800;
                text-decoration: none;
            }
        </style>
    </head>
    <body>
        <main>
            <section>
                <span class="badge">서비스 오류</span>
                <h1>개발자가 화면 수정중입니다!</h1>
                <p>일시적으로 화면을 불러오지 못했습니다. 잠시 후 다시 접속해주세요.</p>
                <a href="/">다시 접속하기</a>
            </section>
        </main>
    </body>
</html>
