spring:
  application:
    name: Ounce

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/Ounce?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: Mickey51799@@

  jpa:
    # 사용할 데이터베이스의 방언(Dialect) 설정
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      # 엔티티 변경 시 테이블 스키마 자동 수정 전략
      # 개발 단계: update 또는 create, 운영 단계: none 또는 validate 권장
      ddl-auto: update
    properties:
      hibernate:
        # 실행되는 SQL문을 콘솔창에 출력
        show_sql: true
        # 출력되는 SQL문을 보기 좋게 포맷팅
        format_sql: true
        # SQL 주석(Comment) 표시
        use_sql_comments: true

kind: Application